# kitty — compacto y minimalista. Los colores vienen del tema activo (config/theme).

# ── Fuente ─────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0
modify_font      cell_height 112%
disable_ligatures cursor

# ── Ventana ────────────────────────────────────────────
window_padding_width   8 12
hide_window_decorations yes
background_opacity     0.94
confirm_os_window_close 0
enable_audio_bell      no
visual_bell_duration   0.0
remember_window_size   no
initial_window_width   100c
initial_window_height  28c
placement_strategy     center

# ── Cursor ─────────────────────────────────────────────
cursor_shape              beam
cursor_beam_thickness     1.6
cursor_blink_interval     0.6
cursor_stop_blinking_after 10
cursor_trail              3
cursor_trail_decay        0.08 0.3

# ── Scroll / mouse ─────────────────────────────────────
scrollback_lines         10000
wheel_scroll_multiplier  3.0
copy_on_select           yes
mouse_hide_wait          2.0
url_style                curly
detect_urls              yes

# ── Splits y pestañas ──────────────────────────────────
enabled_layouts       splits, stack
window_border_width   1pt
window_margin_width   0
single_window_margin_width 0
inactive_text_alpha   0.85

tab_bar_edge          bottom
tab_bar_style         powerline
tab_powerline_style   round
tab_bar_min_tabs      2
tab_title_template    " {index} {title.split('/')[-1][:24]} "
active_tab_font_style bold
inactive_tab_font_style normal

# ── Atajos ─────────────────────────────────────────────
map ctrl+shift+enter  launch --location=hsplit --cwd=current
map ctrl+shift+\      launch --location=vsplit --cwd=current
map ctrl+shift+t      new_tab_with_cwd
map ctrl+shift+z      toggle_layout stack
map ctrl+shift+left   neighboring_window left
map ctrl+shift+right  neighboring_window right
map ctrl+shift+up     neighboring_window up
map ctrl+shift+down   neighboring_window down
map ctrl+equal        change_font_size all +1.0
map ctrl+minus        change_font_size all -1.0
map ctrl+0            change_font_size all 0

shell_integration enabled

# ── Colores ────────────────────────────────────────────
# Generados por `theme` (config/theme); `theme set` recarga las terminales.
include ~/.cache/theme/kitty.conf
